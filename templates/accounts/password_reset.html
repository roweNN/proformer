{% extends "base.html" %}

{% block title %}Recuperar cuenta{% endblock %}

{% block content %}
<h1>Recuperar cuenta</h1>
<p>Te enviaremos link de recuperacion por Mailgun.</p>
<form method="post">
    {% csrf_token %}
    <div class="form-row">{{ form.email.label_tag }}{{ form.email }}</div>
    {{ form.email.errors }}
    <button class="btn" type="submit">Enviar link</button>
</form>
<div class="links">
    <a href="{% url 'login' %}">Volver al login</a>
</div>
{% endblock %}
